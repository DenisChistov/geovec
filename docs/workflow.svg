<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1276" viewBox="0 0 1120 1276" role="img" aria-labelledby="title desc">
<title id="title">Кросс-валидация и финальный тест геолокации</title>
<desc id="desc">Слева путь от 250 тысяч снимков через пять внешних фолдов с географическими ячейками и вложенным обучением CatBoost до переобучения победителя на 85 процентах. Справа пунктир показывает 15 процентов, доступные только для финальной оценки WGS84.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path fill="#1e749b" d="M0 0L10 5L0 10Z"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path fill="#a16207" d="M0 0L10 5L0 10Z"/></marker></defs>
<rect width="1120" height="1276" fill="#f8fafc"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="48" y="64" fill="#0f172a" font-size="40" font-weight="700">От эмбеддингов до финального теста</text>
<text x="48" y="101" fill="#475569" font-size="21" font-weight="400">Геолокация по снимкам • GPU Colab • кратчайшее расстояние по WGS84</text>
<rect x="48" y="132" width="1024" height="78" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="68" y="164" fill="#0f172a" font-size="23" font-weight="700">250 000 снимков</text>
<text x="68" y="189" fill="#334155" font-size="17" font-weight="400">GeoCLIP 512 + StreetCLIP 768 → 1 280 признаков на снимок</text>
<rect x="48" y="252" width="687" height="86" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="68" y="284" fill="#0f172a" font-size="23" font-weight="700">85% · 212 500 снимков для разработки</text>
<text x="68" y="309" fill="#334155" font-size="17" font-weight="400">Общие пять внешних фолдов для всех вариантов</text>
<rect x="756" y="252" width="316" height="86" rx="15" fill="#fffbeb" stroke="#d6a62d" stroke-width="1.5"/>
<text x="776" y="284" fill="#0f172a" font-size="23" font-weight="700">15% · 37 500</text>
<text x="776" y="309" fill="#334155" font-size="17" font-weight="400">Отложенный тест</text>
<path d="M560 210 V228 H392 V252" fill="none" stroke="#1e749b" stroke-width="2.5" marker-end="url(#blue)" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M560 210 V228 H914 V252" fill="none" stroke="#a16207" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#gold)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="48" y="378" width="1024" height="556" rx="22" fill="#eaf7fd" stroke="#a6cfe2" stroke-width="1.5"/>
<text x="72" y="415" fill="#0f172a" font-size="27" font-weight="700">Подбор на пяти внешних фолдах</text>
<text x="72" y="440" fill="#475569" font-size="18" font-weight="400">На каждом шаге меняется внешняя валидационная часть.</text>
<rect x="72" y="461" width="527" height="76" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="92" y="493" fill="#0f172a" font-size="23" font-weight="700">170 000 · внешнее обучение</text>
<text x="92" y="518" fill="#334155" font-size="17" font-weight="400">Метки доступны только для обучения этой ветки</text>
<rect x="644" y="461" width="403" height="76" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="664" y="493" fill="#0f172a" font-size="23" font-weight="700">42 500 · валидация</text>
<text x="664" y="518" fill="#334155" font-size="17" font-weight="400">Метки нужны для оценки прогноза</text>
<rect x="72" y="581" width="527" height="98" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="92" y="613" fill="#0f172a" font-size="23" font-weight="700">Внутренние разбиения</text>
<text x="92" y="638" fill="#334155" font-size="17" font-weight="400">Для каждой строки строим прогнозы сети и kNN</text>
<text x="92" y="660" fill="#334155" font-size="17" font-weight="400">по моделям, обученным на других строках.</text>
<rect x="644" y="581" width="403" height="111" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="664" y="613" fill="#0f172a" font-size="23" font-weight="700">Прогнозы на фолде</text>
<text x="664" y="638" fill="#334155" font-size="17" font-weight="400">Сеть, поиск и классификатор ячеек</text>
<text x="664" y="660" fill="#334155" font-size="17" font-weight="400">учатся на внешних 170 000.</text>
<text x="664" y="682" fill="#334155" font-size="17" font-weight="400">Число геоячеек — 512 или 1 024.</text>
<rect x="72" y="722" width="527" height="98" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="92" y="754" fill="#0f172a" font-size="23" font-weight="700">Обучение CatBoost</text>
<text x="92" y="779" fill="#334155" font-size="17" font-weight="400">Вход — прогнозы сети и соседей, их расхождение</text>
<text x="92" y="801" fill="#334155" font-size="17" font-weight="400">и признаки уверенности поиска.</text>
<rect x="644" y="722" width="403" height="111" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="664" y="754" fill="#0f172a" font-size="23" font-weight="700">Оценка по WGS84</text>
<text x="664" y="779" fill="#334155" font-size="17" font-weight="400">Сравниваем сеть, поиск, гибриды,</text>
<text x="664" y="801" fill="#334155" font-size="17" font-weight="400">CatBoost и прогнозы по ячейкам.</text>
<text x="664" y="823" fill="#334155" font-size="17" font-weight="400">Частотный prior — ориентир.</text>
<rect x="72" y="864" width="975" height="48" rx="12" fill="#075985" stroke="#075985" stroke-width="1.5"/>
<text x="92" y="895" fill="#ffffff" font-size="19" font-weight="700">Выбираем конфигурацию с минимальным RMSE по всем пяти фолдам</text>
