<path d="M599 773 H644" fill="none" stroke="#1e749b" stroke-width="2.5" marker-end="url(#blue)" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M845 833 V864" fill="none" stroke="#1e749b" stroke-width="2.5" marker-end="url(#blue)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="48" y="974" width="1024" height="266" rx="22" fill="#f0fdf4" stroke="#a7d6b4" stroke-width="1.5"/>
<text x="72" y="1011" fill="#0f172a" font-size="27" font-weight="700">Переобучение и оценка победителя</text>
<text x="72" y="1036" fill="#475569" font-size="18" font-weight="400">Конфигурация зафиксирована до подсчёта метрик на тесте.</text>
<rect x="72" y="1072" width="550" height="111" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="92" y="1104" fill="#0f172a" font-size="23" font-weight="700">Переобучаем на всех 212 500</text>
<text x="92" y="1129" fill="#334155" font-size="17" font-weight="400">Для CatBoost заново получаем внутренние</text>
<text x="92" y="1151" fill="#334155" font-size="17" font-weight="400">прогнозы и обучаем базовые модели на всех 85%.</text>
<rect x="668" y="1072" width="379" height="111" rx="15" fill="#fffbeb" stroke="#d6a62d" stroke-width="1.5"/>
<text x="688" y="1104" fill="#0f172a" font-size="23" font-weight="700">Тест на 37 500 снимках</text>
<text x="688" y="1129" fill="#334155" font-size="17" font-weight="400">Один итоговый прогноз</text>
<text x="688" y="1151" fill="#334155" font-size="17" font-weight="400">MAE и RMSE в км по WGS84</text>
<path d="M559 934 V974" fill="none" stroke="#1e749b" stroke-width="2.5" marker-end="url(#blue)" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M622 1127 H668" fill="none" stroke="#1e749b" stroke-width="2.5" marker-end="url(#blue)" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1072 295 H1094 V1127 H1047" fill="none" stroke="#a16207" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#gold)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="1214" fill="#475569" font-size="17" font-weight="400">Пунктир показывает отдельный путь тестовой выборки.</text>
</g></svg>