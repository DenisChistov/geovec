<rect x="48" y="1074" width="1024" height="266" rx="22" fill="#f0fdf4" stroke="#a7d6b4" stroke-width="1.5"/>
<text x="72" y="1111" fill="#0f172a" font-size="27" font-weight="700">Переобучение и оценка победителя</text>
<text x="72" y="1136" fill="#475569" font-size="18" font-weight="400">Конфигурация зафиксирована до подсчёта метрик на тесте.</text>
<rect x="72" y="1172" width="550" height="111" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="92" y="1204" fill="#0f172a" font-size="23" font-weight="700">Переобучаем на всех 212 500</text>
<text x="92" y="1229" fill="#334155" font-size="17" font-weight="400">Для стека — прогнозы пяти внешних фолдов.</text>
<text x="92" y="1251" fill="#334155" font-size="17" font-weight="400">Базовые модели обучены на всех 85%.</text>
