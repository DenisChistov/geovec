<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 510" role="img" aria-labelledby="title desc">
  <title id="title">Почему географические MAE и MSE выбирают разные точки</title>
  <desc id="desc">Учебный пример: 80 процентов вероятности находятся на отметке 100 км, 20 процентов на отметке 2000 км. Медиана в 100 км имеет MAE 380 км и RMSE 850 км; среднее в 480 км имеет MAE 608 км и RMSE 760 км.</desc>
  <defs>
    <style>
      text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#233247;font-size:16px}.title{font-size:31px;font-weight:700}.subtitle{fill:#5c7188;font-size:15px}.head{font-size:22px;font-weight:650}.num{font-size:28px;font-weight:700}.sub{font-size:14px;fill:#526781}.small{font-size:13px;fill:#526781}.axis{stroke:#9db0c4;stroke-width:2}.blue{fill:#147c96}.orange{fill:#cf782d}
    </style>
  </defs>
  <rect width="1060" height="510" rx="24" fill="#f5f8fc"/>
  <text x="40" y="49" class="title">Один снимок, две географические гипотезы</text>
  <text x="40" y="76" class="subtitle">Упрощённый учебный пример на прямой геодезической — не измерение реального снимка.</text>
  <rect x="40" y="99" width="980" height="156" rx="16" fill="#fff" stroke="#d5e0eb"/>
  <line x1="80" y1="172" x2="980" y2="172" class="axis"/>
  <g class="small"><text x="78" y="207">0</text><text x="294" y="207" text-anchor="middle">500</text><text x="508" y="207" text-anchor="middle">1 000</text><text x="722" y="207" text-anchor="middle">1 500</text><text x="936" y="207" text-anchor="middle">2 000 км</text></g>
  <g stroke="#9db0c4"><line x1="80" y1="172" x2="80" y2="181"/><line x1="294" y1="172" x2="294" y2="181"/><line x1="508" y1="172" x2="508" y2="181"/><line x1="722" y1="172" x2="722" y2="181"/><line x1="936" y1="172" x2="936" y2="181"/></g>
  <circle cx="123" cy="172" r="27" fill="#147c96" opacity=".16"/><circle cx="123" cy="172" r="16" fill="#147c96"/>
  <circle cx="936" cy="172" r="16" fill="#cf782d" opacity=".18"/><circle cx="936" cy="172" r="8" fill="#cf782d"/>
  <text x="60" y="128" class="head">80% · ближняя группа</text><text x="60" y="147" class="small">Истинная точка на 100 км</text>
  <text x="998" y="128" class="head" text-anchor="end">20% · далёкая группа</text><text x="998" y="147" class="small" text-anchor="end">Истинная точка на 2 000 км</text>
  <path d="M123 187V232" stroke="#147c96" stroke-width="2" stroke-dasharray="4 3"/><path d="M285 172V232" stroke="#cf782d" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="123" cy="232" r="6" fill="#147c96"/><circle cx="285" cy="232" r="6" fill="#cf782d"/>
  <text x="134" y="238" class="small">медиана</text><text x="296" y="238" class="small">среднее</text>
  <rect x="40" y="275" width="480" height="193" rx="16" fill="#eaf6f8" stroke="#c3e2e7"/>
  <text x="60" y="307" class="head blue">MAE — остаёмся около большинства</text>
  <text x="60" y="340" class="num blue">100 км</text><text x="60" y="365" class="sub">Взвешенная медиана: 80% массы в этой точке.</text>
  <text x="60" y="403" class="head">MAE 380 км</text><text x="278" y="403" class="head">RMSE 849,7 км</text>
  <text x="60" y="429" class="small">0,8·0 + 0,2·1900</text><text x="278" y="429" class="small">√(0,8·0² + 0,2·1900²)</text>
  <rect x="540" y="275" width="480" height="193" rx="16" fill="#fff4e6" stroke="#f4d9b7"/>
  <text x="560" y="307" class="head orange">MSE — притягиваемся к далёкой точке</text>
  <text x="560" y="340" class="num orange">480 км</text><text x="560" y="365" class="sub">Взвешенное среднее: 0,8·100 + 0,2·2000.</text>
  <text x="560" y="403" class="head">MAE 608 км</text><text x="778" y="403" class="head">RMSE 760 км</text>
  <text x="560" y="429" class="small">0,8·380 + 0,2·1520</text><text x="778" y="429" class="small">√(0,8·380² + 0,2·1520²)</text>
  <text x="40" y="495" class="subtitle">Эллипсоид WGS84 используется в настоящем эксперименте; здесь показывается только логика двух функций потерь.</text>
</svg>
